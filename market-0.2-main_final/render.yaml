# Render.com Fullstack Blueprint for SoilPilot
# Deploys Backend (FastAPI), Frontend (Next.js), and PostgreSQL Database
services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: soilpilot-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: soilpilot-db
          property: connectionString

  # 2. Next.js Frontend Web Service
  - type: web
    name: soilpilot-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: soilpilot-backend
          property: host

databases:
  # 3. PostgreSQL Database with PostGIS support
  - name: soilpilot-db
    plan: free
    region: oregon
    databaseName: soilpilot_db
    user: soilpilot_user
